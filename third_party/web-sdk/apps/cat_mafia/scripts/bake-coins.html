<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Bake Cat Mafia coins</title>
		<style>
			html,
			body {
				margin: 0;
				background: #111;
				color: #eee;
				font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
			}
			#status {
				padding: 12px 16px;
			}
			#host {
				width: 256px;
				height: 256px;
				background: transparent;
			}
		</style>
	</head>
	<body>
		<div id="status">Loading Spine…</div>
		<div id="host"></div>
		<script src="/vendor/spine-player.js"></script>
		<script>
			const VIEWPORT = {
				x: -300,
				y: -310,
				width: 600,
				height: 620,
				padLeft: '0%',
				padRight: '0%',
				padTop: '0%',
				padBottom: '0%',
			};
			const FRAME = 256;
			const JOBS = [
				{ out: 'particles', skin: 'coin_gold', animation: 'main_coin_fast', fps: 20, prefix: '' },
				{ out: 'paw', skin: 'coin_bronze', animation: 'appear', fps: 20, prefix: 'bronze_appear_' },
				{ out: 'paw', skin: 'coin_bronze', animation: 'main_coin_slow', fps: 18, prefix: 'bronze_loop_' },
				{ out: 'paw', skin: 'coin_silver', animation: 'appear', fps: 20, prefix: 'silver_appear_' },
				{ out: 'paw', skin: 'coin_silver', animation: 'main_coin_slow', fps: 18, prefix: 'silver_loop_' },
				{ out: 'paw', skin: 'coin_gold', animation: 'appear', fps: 20, prefix: 'gold_appear_' },
				{ out: 'paw', skin: 'coin_gold', animation: 'main_coin_slow', fps: 18, prefix: 'gold_loop_' },
			];

			const statusEl = document.getElementById('status');
			const host = document.getElementById('host');
			const setStatus = (text) => {
				statusEl.textContent = text;
			};

			const trimCanvas = (source) => {
				const ctx = source.getContext('2d', { willReadFrequently: true });
				const { width, height } = source;
				const data = ctx.getImageData(0, 0, width, height).data;
				let x0 = width;
				let y0 = height;
				let x1 = 0;
				let y1 = 0;
				for (let y = 0; y < height; y++) {
					for (let x = 0; x < width; x++) {
						if (data[(y * width + x) * 4 + 3] > 8) {
							if (x < x0) x0 = x;
							if (y < y0) y0 = y;
							if (x > x1) x1 = x;
							if (y > y1) y1 = y;
						}
					}
				}
				if (x1 < x0 || y1 < y0) {
					return { canvas: source, x: 0, y: 0, w: width, h: height };
				}
				const pad = 1;
				x0 = Math.max(0, x0 - pad);
				y0 = Math.max(0, y0 - pad);
				x1 = Math.min(width - 1, x1 + pad);
				y1 = Math.min(height - 1, y1 + pad);
				const w = x1 - x0 + 1;
				const h = y1 - y0 + 1;
				const cut = document.createElement('canvas');
				cut.width = w;
				cut.height = h;
				cut.getContext('2d').drawImage(source, x0, y0, w, h, 0, 0, w, h);
				return { canvas: cut, x: x0, y: y0, w, h };
			};

			const packFrames = (frames) => {
				const gap = 2;
				const maxW = 2048;
				let x = gap;
				let y = gap;
				let rowH = 0;
				let sheetW = gap;
				let sheetH = gap;
				const placed = frames.map((frame) => {
					if (x + frame.w + gap > maxW) {
						x = gap;
						y += rowH + gap;
						rowH = 0;
					}
					const placedFrame = { ...frame, px: x, py: y };
					x += frame.w + gap;
					rowH = Math.max(rowH, frame.h);
					sheetW = Math.max(sheetW, x);
					sheetH = Math.max(sheetH, y + rowH + gap);
					return placedFrame;
				});
				const sheet = document.createElement('canvas');
				sheet.width = sheetW;
				sheet.height = sheetH;
				const ctx = sheet.getContext('2d');
				const jsonFrames = {};
				const animations = {};
				for (const frame of placed) {
					ctx.drawImage(frame.canvas, frame.px, frame.py);
					jsonFrames[frame.name] = {
						frame: { x: frame.px, y: frame.py, w: frame.w, h: frame.h },
						rotated: false,
						trimmed: true,
						spriteSourceSize: { x: frame.x, y: frame.y, w: frame.w, h: frame.h },
						sourceSize: { w: FRAME, h: FRAME },
					};
					(animations[frame.anim] ??= []).push(frame.name);
				}
				return { sheet, jsonFrames, animations, sheetW, sheetH };
			};

			const canvasToWebp = (canvas) =>
				new Promise((resolve, reject) => {
					canvas.toBlob(
						(blob) => {
							if (!blob) {
								reject(new Error('webp encode failed'));
								return;
							}
							const reader = new FileReader();
							reader.onload = () => resolve(reader.result.split(',')[1]);
							reader.onerror = reject;
							reader.readAsDataURL(blob);
						},
						'image/webp',
						0.9,
					);
				});

			const waitFrame = () => new Promise((resolve) => requestAnimationFrame(() => resolve()));

			const captureJob = async (player, job) => {
				const skeleton = player.skeleton;
				const state = player.animationState;
				skeleton.setSkinByName(job.skin);
				skeleton.setSlotsToSetupPose();
				skeleton.setToSetupPose();
				const entry = state.setAnimation(0, job.animation, false);
				const duration = entry.animation.duration || 0.6;
				const count = Math.max(8, Math.round(duration * job.fps));
				const frames = [];
				player.paused = true;
				for (let i = 0; i < count; i++) {
					entry.trackTime = (i / count) * duration;
					entry.animationLast = entry.trackTime;
					state.apply(skeleton);
					skeleton.updateWorldTransform(spine.Physics ? spine.Physics.update : 0);
					player.paused = false;
					await waitFrame();
					await waitFrame();
					player.paused = true;
					const snap = document.createElement('canvas');
					snap.width = FRAME;
					snap.height = FRAME;
					snap.getContext('2d').drawImage(player.canvas, 0, 0, FRAME, FRAME);
					const trimmed = trimCanvas(snap);
					const index = String(i + 1).padStart(2, '0');
					frames.push({
						...trimmed,
						name: `${job.prefix || ''}${index}.png`,
						anim: job.prefix ? job.prefix.replace(/_$/, '') : 'coin',
					});
				}
				return frames;
			};

			const run = async () => {
				const player = await new Promise((resolve, reject) => {
					const created = new spine.SpinePlayer(host, {
						jsonUrl: '/assets/spines/coins/coins.json',
						atlasUrl: '/assets/spines/coins/coins.atlas',
						showControls: false,
						showLoading: false,
						backgroundColor: '#00000000',
						premultipliedAlpha: false,
						preserveDrawingBuffer: true,
						alpha: true,
						skin: 'coin_gold',
						animation: 'main_coin_fast',
						viewport: VIEWPORT,
						success: (p) => {
							p.skeleton.scaleY = -1;
							p.paused = true;
							resolve(p);
						},
						error: (_p, msg) => reject(new Error(msg || 'spine load failed')),
					});
					setTimeout(() => reject(new Error('spine load timeout')), 15000);
					void created;
				});

				const buckets = { particles: [], paw: [] };
				for (const job of JOBS) {
					setStatus(`Baking ${job.skin} / ${job.animation}…`);
					const frames = await captureJob(player, job);
					buckets[job.out].push(...frames);
				}

				const outputs = [];
				for (const [key, frames] of Object.entries(buckets)) {
					setStatus(`Packing ${key}…`);
					const packed = packFrames(frames);
					const imageName = key === 'particles' ? 'coins.webp' : 'coins_paw.webp';
					const jsonName = key === 'particles' ? 'coins.json' : 'coins_paw.json';
					const webp = await canvasToWebp(packed.sheet);
					outputs.push({
						jsonName,
						imageName,
						webp,
						json: {
							frames: packed.jsonFrames,
							animations: packed.animations,
							meta: {
								app: 'cat_mafia/scripts/bake-coins.html',
								version: '1.0',
								image: imageName,
								format: 'RGBA8888',
								size: { w: packed.sheetW, h: packed.sheetH },
								scale: '1',
							},
						},
					});
				}

				setStatus('Saving…');
				const res = await fetch('/save', {
					method: 'POST',
					headers: { 'content-type': 'application/json' },
					body: JSON.stringify({ outputs }),
				});
				if (!res.ok) throw new Error(`save failed: ${res.status}`);
				window.__BAKE_DONE__ = true;
				setStatus('Done.');
			};

			run().catch((err) => {
				window.__BAKE_ERROR__ = String(err && err.message ? err.message : err);
				setStatus(`Error: ${window.__BAKE_ERROR__}`);
			});
		</script>
	</body>
</html>
